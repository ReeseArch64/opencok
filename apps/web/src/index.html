<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1722" />
    <meta
      name="description"
      content="OpenCok Web — início da reconstrução do cliente para navegador."
    />
    <title>OpenCok</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="loading-screen" aria-label="OpenCok — carregamento">
      <img class="background" id="background" alt="" />
      <div class="shade" aria-hidden="true"></div>
      <header class="version">
        <span>Version: 1.0.0 <span class="web-label">WEB</span></span>
        <span>Criador: ReeseArch64</span>
      </header>
      <div class="loading-content">
        <div class="identity">
          <h1><img id="logo" alt="OpenCok" /></h1>
        </div>
        <section class="connection" aria-label="Conexão com o servidor">
          <p class="kingdom">REINO 1 <span aria-hidden="true">·</span> COK1</p>
          <div class="progress-shell">
            <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
            <img id="progress-frame" alt="" />
            <progress
              id="progress"
              max="3"
              value="0"
              aria-label="Carregamento dos recursos visuais"
            ></progress>
          </div>
          <p id="status" role="status" aria-live="polite">Carregando recursos…</p>
          <p class="latency" id="latency">Preparando a conexão</p>
          <button id="retry" type="button" disabled>Verificar conexão</button>
        </section>
      </div>
      <footer>OPEN COK <span aria-hidden="true">/</span> CLIENTE WEB</footer>
      <noscript>Ative o JavaScript para carregar o cliente e verificar a conexão.</noscript>
    </main>
  </body>
</html>
