services:
  server:
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    depends_on:
      minio:
        condition: service_healthy
      postgres-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  chat:
    depends_on:
      postgres-setup:
        condition: service_completed_successfully

  pgadmin:
    depends_on:
      postgres-setup:
        condition: service_completed_successfully

  gateway:
    depends_on:
      minio-setup:
        condition: service_completed_successfully
