volumes:
  maple-data: ~
  pgadmin-data: ~
  pgadmin-servers: ~

services:
  gateway:
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=opencok,deployment.environment.name=development
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8080"
      TRAEFIK_ENTRYPOINTS_GAME_ADDRESS: ":9933"
      TRAEFIK_PROVIDERS_FILE_FILENAME: /etc/traefik/dynamic.yml
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      TRAEFIK_EXPERIMENTAL_OTLPLOGS: "true"
      TRAEFIK_LOG_LEVEL: WARN
      TRAEFIK_LOG_OTLP_SERVICENAME: gateway
      TRAEFIK_LOG_OTLP_HTTP_ENDPOINT: http://maple:4318/v1/logs
      TRAEFIK_LOG_OTLP_HTTP_HEADERS_X-MAPLE-INGEST-KEY: ${MAPLE_LOCAL_INGEST_KEY}
      TRAEFIK_ACCESSLOG_OTLP_SERVICENAME: gateway
      TRAEFIK_ACCESSLOG_OTLP_HTTP_ENDPOINT: http://maple:4318/v1/logs
      TRAEFIK_ACCESSLOG_OTLP_HTTP_HEADERS_X-MAPLE-INGEST-KEY: ${MAPLE_LOCAL_INGEST_KEY}
      TRAEFIK_METRICS_OTLP_SERVICENAME: gateway
      TRAEFIK_METRICS_OTLP_HTTP_ENDPOINT: http://maple:4318/v1/metrics
      TRAEFIK_METRICS_OTLP_HTTP_HEADERS_X-MAPLE-INGEST-KEY: ${MAPLE_LOCAL_INGEST_KEY}
      TRAEFIK_TRACING_SERVICENAME: gateway
      TRAEFIK_TRACING_OTLP_HTTP_ENDPOINT: http://maple:4318/v1/traces
      TRAEFIK_TRACING_OTLP_HTTP_HEADERS_X-MAPLE-INGEST-KEY: ${MAPLE_LOCAL_INGEST_KEY}
    ports:
      - 80:8080
      - 9933:9933

  gameserver:
    build:
      target: development
    command: ["go", "run", "./cmd/gameserver", "-addr", "0.0.0.0:9933", "-realm-url", "http://realm:9940"]
    volumes:
      - ../gameserver:/app:ro

  realm:
    command: ["bun", "--no-env-file", "--watch", "apps/realm/src/main.ts"]
    volumes:
      - ../apps/realm/src:/app/apps/realm/src:ro
      - ../packages/contracts/src:/app/packages/contracts/src:ro

  maple:
    image: opencok-maple:v0.3.0-csp1
    build:
      context: ./maple
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      MAPLE_LOCAL_ACCESS_TOKEN: ${MAPLE_LOCAL_ACCESS_TOKEN}
      MAPLE_TELEMETRY: "off"
      MAPLE_NO_UPDATE_CHECK: 1
    ports:
      - 4318:4318
    volumes:
      - maple-data:/data
    stop_grace_period: 45s

  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432

  pgadmin:
    image: dpage/pgadmin4:9.18
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opencok.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /configuration/servers.json
    depends_on: [postgres]
    ports:
      - 5050:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - pgadmin-servers:/configuration:ro

  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - 27017:27017

  mongo-express:
    image: mongo-express:1.0.2
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:mongo@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on: [mongodb]
    ports:
      - 8081:8081

  redis:
    ports:
      - 6379:6379
