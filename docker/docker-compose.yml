name: opencok

volumes:
  postgres-data: ~
  mongodb-data: ~
  mongodb-config: ~
  redis-data: ~

networks:
  opencok-internal-network:
    name: opencok-internal-network
    internal: true
    driver: bridge

  opencok-external-network:
    internal: false
    name: opencok-external-network
    driver: bridge

services:
  gateway:
    image: traefik:v3.7.15
    networks: [opencok-internal-network, opencok-external-network]
    volumes:
      - ./gateway/dynamic.dev.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - gameserver
      - maple

  gameserver:
    build:
      context: ../gameserver
      target: runtime
    command: ["go", "run", "./cmd/gameserver", "-addr", "0.0.0.0:9933", "-realm-url", "http://realm:9940"]
    depends_on: [realm]
    networks: [opencok-internal-network]

  realm:
    build:
      context: ..
      dockerfile: apps/realm/Dockerfile
    networks: [opencok-internal-network]

  postgres:
    image: postgres:17.11-bookworm
    networks: [opencok-internal-network]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8.0.34
    networks: [opencok-internal-network, opencok-external-network]
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb

  redis:
    image: redis:8.10.3-trixie
    networks: [opencok-internal-network]
    command: [redis-server, "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
