<!doctype html>
<html lang="pt-BR">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="OpenCoK — construa seu legado." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000000;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        justify-items: center;
        align-items: center;
        background: #000;
      }
      #splash img { width: min(70vw, 192px); }
    </style>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="OpenCoK" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <title>OpenCoK</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div id="splash" role="img" aria-label="OpenCoK">
      <img src="assets/assets/ui/login/game_logo.png" alt="" />
    </div>
    <script>
      window.addEventListener('flutter-first-frame', () => {
        document.getElementById('splash')?.remove();
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
