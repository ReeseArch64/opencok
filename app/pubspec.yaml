    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flame: 1.38.2
  jailbreak_root_detection: 1.2.3
  web: 1.1.2
  audioplayers: ^6.8.1
  web_socket_channel: ^3.0.3
  flutter_dotenv: ^6.0.1
