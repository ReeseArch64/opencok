services:
  api:
    environment:
      API_FILES_ENABLED: "true"
      FILES_SIGNING_KEY_FILE: /run/opencok/image-upload-key
      S3_BUCKET: opencok-uploads
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: opencok
      AWS_SECRET_ACCESS_KEY: opencok-secret
    volumes:
      - type: bind
        source: ${FILES_SIGNING_KEY_FILE:?Set an absolute host signing-key path}
        target: /run/opencok/image-upload-key
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      minio:
        condition: service_healthy
