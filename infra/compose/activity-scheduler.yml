services:
  server:
    environment:
      ACTIVITY_SCHEDULER_MODE: external
      ACTIVITY_SCHEDULER_SECRET: ${ACTIVITY_SCHEDULER_SECRET:?Dedicated realm scheduler key required}
      KINGDOM_ID: ${SCHEDULER_KINGDOM_ID:?Scheduler kingdom required}
      KINGDOM_DATABASE_NAME: ${SCHEDULER_KINGDOM_DATABASE_NAME:?Scheduler kingdom database required}
  mail-workers:
    environment:
      KINGDOM_ID: ${SCHEDULER_KINGDOM_ID:?Scheduler kingdom required}
      KINGDOM_DATABASE_NAME: ${SCHEDULER_KINGDOM_DATABASE_NAME:?Scheduler kingdom database required}
  scheduler:
    profiles: [scheduler]
    environment:
      KINGDOM_ID: ${SCHEDULER_KINGDOM_ID:?Scheduler kingdom required}
      KINGDOM_DATABASE_NAME: ${SCHEDULER_KINGDOM_DATABASE_NAME:?Scheduler kingdom database required}
      SCHEDULER_DATABASE_URL: ${SCHEDULER_DATABASE_URL:?Read-only scheduler URL required}
      ACTIVITY_SCHEDULER_SECRET: ${ACTIVITY_SCHEDULER_SECRET:?Dedicated realm scheduler key required}
