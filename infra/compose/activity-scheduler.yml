services:
  server:
    environment:
      ACTIVITY_SCHEDULER_MODE: external
      ACTIVITY_SCHEDULER_SECRET: ${ACTIVITY_SCHEDULER_SECRET:?Dedicated realm scheduler key required}
      KINGDOM_ID: ${SCHEDULER_KINGDOM_ID:?Scheduler kingdom required}
      KINGDOM_DATABASE_NAME: ${SCHEDULER_KINGDOM_DATABASE_NAME:?Scheduler kingdom database required}
  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    profiles: [scheduler]
    restart: unless-stopped
    networks: [opencok-internal-network]
    environment:
      ACTIVITY_SCHEDULER_MODE: external
      ACTIVITY_SCHEDULER_SECRET: ${ACTIVITY_SCHEDULER_SECRET:?Dedicated realm scheduler key required}
      KINGDOM_ID: ${SCHEDULER_KINGDOM_ID:?Scheduler kingdom required}
      KINGDOM_DATABASE_NAME: ${SCHEDULER_KINGDOM_DATABASE_NAME:?Scheduler kingdom database required}
      SCHEDULER_DATABASE_URL: ${SCHEDULER_DATABASE_URL:?Read-only scheduler URL required}
      SCHEDULER_OWNER_URL: http://server:18090
      SCHEDULER_HEALTH_HOST: 0.0.0.0
      SCHEDULER_HEALTH_PORT: 18092
      SCHEDULER_TIMEOUT_MS: 5000
      SCHEDULER_POLL_MS: 1000
      SCHEDULER_POOL: 2
      SCHEDULER_BATCH_SIZE: 64
      SCHEDULER_OWNER_BUDGET: 4
      OTEL_EXPORTER_OTLP_ENDPOINT: http://maple:4318
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:18092/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
