name: opencok

networks:
  opencok-internal-network:
    name: opencok-internal-network
    internal: true
    driver: bridge

  opencok-external-network:
    internal: false
    name: opencok-external-network
    driver: bridge

volumes:
  postgres-data: ~
  pgadmin-data: ~
  pgadmin-servers: ~
  redis-data: ~
  mongodb-data: ~
  zookeeper-data: ~
  zookeeper-datalog: ~
  zookeeper-logs: ~
  minio-data: ~
  redisinsight-data: ~
  portainer-data: ~
  maple-data: ~

services:
  maple:
    image: opencok-maple:v0.3.0-csp1
    build:
      context: ./infra/observability/maple
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [all, dev, observability]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      MAPLE_LOCAL_ACCESS_TOKEN: ${MAPLE_LOCAL_ACCESS_TOKEN}
      MAPLE_TELEMETRY: "off"
      MAPLE_NO_UPDATE_CHECK: 1
    ports:
      - 4318:4318
    volumes:
      - maple-data:/data
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  portainer:
    image: portainer/portainer-ce:lts
    command: [--http-enabled]
    container_name: opencok-portainer
    profiles: [all, dev]
    networks: [opencok-external-network]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    ports:
      - 9443:9000

  postgres:
    image: postgres:17.11-bookworm
    container_name: opencok-postgres
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-setup:
    build:
      context: .
      dockerfile: infra/compose/postgres.Dockerfile
    container_name: opencok-postgres-setup
    restart: no
    profiles: [all, dev]
    networks: [opencok-internal-network]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-servers:/configuration

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: opencok-pgadmin
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opencok.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_SERVER_JSON_FILE: /configuration/servers.json
    ports:
      - 5050:8080
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - pgadmin-servers:/configuration:ro

  redis:
    image: redis:6.2.24-bookworm
    container_name: opencok-redis
    restart: unless-stopped
    profiles: [all, dev, redis]
    networks: [opencok-internal-network]
    volumes:
      - redis-data:/data
    command:
      [
        redis-server,
        --bind,
        0.0.0.0,
        --tcp-keepalive,
        "60",
        --dir,
        /data,
        --save,
        "900",
        "1",
        --save,
        "300",
        "10",
        --save,
        "60",
        "10000",
        --appendonly,
        "yes",
        --appendfsync,
        everysec,
        --maxmemory,
        384mb,
        --maxmemory-policy,
        noeviction,
        --slowlog-log-slower-than,
        "-1",
      ]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  redisinsight:
    image: redis/redisinsight:latest
    container_name: opencok-redisinsight
    restart: no
    profiles: [all, dev]
    depends_on:
      redis:
        condition: service_healthy
    networks: [opencok-internal-network, opencok-external-network]
    volumes:
      - redisinsight-data:/data
    ports:
      - 5540:5540

  zookeeper:
    image: zookeeper:3.4.14
    container_name: opencok-zookeeper
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network]
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
      - zookeeper-logs:/logs
    environment:
      ZOO_HEAP_SIZE: 256
      ZOO_LOG4J_PROP: INFO,CONSOLE
      ZOO_TICK_TIME: 2000
      ZOO_INIT_LIMIT: 10
      ZOO_SYNC_LIMIT: 5
      ZOO_MAX_CLIENT_CNXNS: 60
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
      ZOO_CFG_EXTRA: 4lw.commands.whitelist=ruok,srvr
    healthcheck:
      test: [CMD-SHELL, "printf srvr | nc -w 2 127.0.0.1 2181 | grep -q 'Mode: standalone'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  minio:
    image: ghcr.io/coollabsio/minio
    container_name: opencok-minio
    restart: unless-stopped
    profiles: [all, dev]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: opencok
      MINIO_ROOT_PASSWORD: opencok-secret
      MINIO_BROWSER_REDIRECT_URL: http://192.168.1.104:9001
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    networks: [opencok-internal-network, opencok-external-network]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mc alias set health http://127.0.0.1:9000 opencok opencok-secret >/dev/null 2>&1 && mc ready health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  minio-setup:
    image: ghcr.io/coollabsio/minio
    container_name: opencok-minio-setup
    restart: no
    profiles: [all, dev]
    entrypoint:
      - sh
      - -ec
      - |
        set -u
        mc alias set local http://minio:9000 opencok opencok-secret >/dev/null
        mc mb --ignore-existing local/opencok-cdn >/dev/null
        mc mb --ignore-existing local/opencok-uploads >/dev/null
        mc anonymous set none local/opencok-uploads >/dev/null
        cat > /tmp/cdn-public-read.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::opencok-cdn/cok.eleximg.com/*","arn:aws:s3:::opencok-cdn/asset.cok.chat/*"]}]}
        JSON
        mc anonymous set-json /tmp/cdn-public-read.json local/opencok-cdn >/dev/null
        mc mirror --overwrite --quiet /source/cok.eleximg.com/ local/opencok-cdn/cok.eleximg.com/ >/dev/null
        mc mirror --overwrite --quiet /source/asset.cok.chat/ local/opencok-cdn/asset.cok.chat/ >/dev/null
        printf '%s\n' 'CDN host trees synchronized; uploads and source archives are not public'
    volumes:
      - ./data/cdn/data:/source:ro
    networks: [opencok-internal-network]
    depends_on:
      minio:
        condition: service_healthy

  server:
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: opencok-server
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      NODE_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://maple:4318
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      OTEL_EXPORT_INTERVAL_MS: 1000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/opencok_global
      KINGDOM_ID: 1
      KINGDOM_DATABASE_NAME: opencok_kingdom_1
      GLOBAL_DATABASE_NAME: opencok_global
      GAME_HOST: 0.0.0.0
      GAME_PORT: 9933
      GAME_HEALTH_PORT: 18090
      GAME_FILES_URL: http://api:8080
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL for API and server}
      GAME_ZOOKEEPER: zookeeper:2181
      GAME_LOGIN_SECRET: ${GAME_LOGIN_SECRET}
      GAME_CROSS_SEARCH: ${GAME_CROSS_SEARCH:-true}
      GAME_CHAT_INTERVAL: ${GAME_CHAT_INTERVAL:-1}
      GAME_FEED_MAX_COUNT: ${GAME_FEED_MAX_COUNT:-3}
      GAME_PLAYER_KINGDOMS: ${GAME_PLAYER_KINGDOMS:-}
      GAME_MAIL_CHAT_URL: ${GAME_MAIL_CHAT_URL:-}
      GAME_NICKNAME_CHAT_URL: ${GAME_NICKNAME_CHAT_URL:-http://chat:8083/_internal/nickname}
      GAME_CHAT_SESSION_URL: ${GAME_CHAT_SESSION_URL:-http://chat:8083/external/session}
      CHAT_SIGNING_SECRET: ${CHAT_SIGNING_SECRET:-opencok-chat-development}
      GAME_MAP_SIZE: 1201
      DEPENDENCY_TIMEOUT_MS: 5000
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:18090/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

  api:
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opencok-api
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      NODE_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://maple:4318
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      OTEL_EXPORT_INTERVAL_MS: 1000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/opencok_global
      GLOBAL_DATABASE_NAME: opencok_global
      KINGDOM_ID: 1
      API_SERVERS_FILE: ""
      API_CHAT_URL: ${API_CHAT_URL:-http://chat:8083}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://192.168.1.104:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-opencok-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-opencok}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-opencok-secret}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL for API and server}
      API_GAME_HOST: 192.168.1.104
      API_GAME_PORT: 9933
      API_DEPENDENCY_TIMEOUT_MS: 3000
    volumes:
      - ./apps/api/resources/servers.json:/etc/opencok/servers.json:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  mongodb:
    image: mongo:8.0.34
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-opencok}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-opencok-development}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  chat:
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    container_name: opencok-chat
    restart: unless-stopped
    profiles: [all, dev]
    init: true
    stop_grace_period: 30s
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/opencok_global
      GLOBAL_DATABASE_NAME: opencok_global
      CHAT_KINGDOM_DATABASES: 1:opencok_kingdom_1,2:opencok_kingdom_2
      CHAT_HOST: 0.0.0.0
      CHAT_PORT: 8083
      CHAT_INSTANCE_ID: ${CHAT_INSTANCE_ID:-chat-local}
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGODB_USER:-opencok}:${MONGODB_PASSWORD:-opencok-development}@mongodb:27017/opencok_chat?authSource=admin}
      CHAT_SIGNING_SECRET: ${CHAT_SIGNING_SECRET:-opencok-chat-development}
      CHAT_WEBSOCKET_URL: ${CHAT_WEBSOCKET_URL:-ws://192.168.1.104:8083/chat/ws}
    ports:
      - 8083:8083
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:8083/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  gateway:
    image: traefik:v3.7.15
    container_name: opencok-gateway
    restart: unless-stopped
    profiles: [all, dev]
    command: [--configFile=/etc/traefik/traefik.yml]
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    networks: [opencok-internal-network, opencok-external-network]
    mem_limit: 256m
    cpus: "0.50"
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - 80:80
      - 9933:9933
    volumes:
      - ./infra/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: [CMD, traefik, healthcheck, --configFile=/etc/traefik/traefik.yml]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
