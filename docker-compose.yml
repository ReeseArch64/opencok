name: opencok

networks:
  opencok-internal-network:
    name: opencok-internal-network
    internal: true
    driver: bridge

  opencok-external-network:
    internal: false
    name: opencok-external-network
    driver: bridge

volumes:
  postgres-data: ~
  pgadmin-data: ~
  pgadmin-servers: ~
  redis-data: ~
  zookeeper-data: ~
  zookeeper-datalog: ~
  zookeeper-logs: ~
  minio-data: ~
  redisinsight-data: ~
  portainer-data: ~

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: opencok-portainer
    restart: no
    profiles: [all, dev]
    networks: [opencok-external-network]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    ports:
      - 9443:9443

  postgres:
    image: postgres:17.11-bookworm
    container_name: opencok-postgres
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-setup:
    build:
      context: .
      dockerfile: infra/compose/postgres.Dockerfile
    container_name: opencok-postgres-setup
    restart: no
    profiles: [all, dev]
    networks: [opencok-internal-network]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-servers:/configuration

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: opencok-pgadmin
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opencok.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_SERVER_JSON_FILE: /configuration/servers.json
    ports:
      - 5050:8080
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - pgadmin-servers:/configuration:ro

    healthcheck:
      test:
        [
          CMD,
          /venv/bin/python3,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/misc/ping', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    build:
      context: .
      dockerfile: infra/compose/redis.Dockerfile
    container_name: opencok-redis
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network]
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: opencok-redisinsight
    restart: no
    profiles: [all, dev]
    depends_on:
      redis:
        condition: service_healthy
    networks: [opencok-internal-network, opencok-external-network]
    volumes:
      - redisinsight-data:/data
    ports:
      - 5540:5540

  zookeeper:
    build:
      context: .
      dockerfile: infra/compose/zookeeper.Dockerfile
    image: opencok-zookeeper
    container_name: opencok-zookeeper
    restart: unless-stopped
    profiles: [all, dev]
    networks: [opencok-internal-network]
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
      - zookeeper-logs:/logs

  minio:
    image: ghcr.io/coollabsio/minio
    container_name: opencok-minio
    restart: unless-stopped
    profiles: [all, dev]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: opencok
      MINIO_ROOT_PASSWORD: opencok-secret
      MINIO_BROWSER_REDIRECT_URL: http://192.168.1.104:9001
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    networks: [opencok-internal-network, opencok-external-network]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mc alias set health http://127.0.0.1:9000 opencok opencok-secret >/dev/null 2>&1 && mc ready health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  minio-setup:
    image: ghcr.io/coollabsio/minio
    container_name: opencok-minio-setup
    restart: no
    profiles: [all, dev]
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    entrypoint: [sh, /usr/local/bin/opencok-cdn-init.sh]
    volumes:
      - type: bind
        source: ./infra/storage/init-cdn.sh
        target: /usr/local/bin/opencok-cdn-init.sh
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./data/cdn/data
        target: /source
        read_only: true
        bind: { create_host_path: false }
    networks: [opencok-internal-network]
    depends_on:
      minio:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: opencok-server

    restart: unless-stopped
    profiles: [all, dev]
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    networks: [opencok-internal-network]
    mem_limit: 1g
    cpus: "2.00"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/opencok_global
      KINGDOM_ID: 1
      KINGDOM_DATABASE_NAME: opencok_kingdom_1
      GLOBAL_DATABASE_NAME: opencok_global
      GAME_HOST: 0.0.0.0
      GAME_PORT: 9933
      GAME_HEALTH_PORT: 18090
      GAME_REDIS_URL: redis://redis:6379/0
      GAME_ZOOKEEPER: zookeeper:2181
      GAME_LOGIN_SECRET: ${GAME_LOGIN_SECRET}
      GAME_CROSS_SEARCH: ${GAME_CROSS_SEARCH:-true}
      GAME_CHAT_INTERVAL: ${GAME_CHAT_INTERVAL:-1}
      GAME_FEED_MAX_COUNT: ${GAME_FEED_MAX_COUNT:-3}
      GAME_PLAYER_KINGDOMS: ${GAME_PLAYER_KINGDOMS:-}
      GAME_MAIL_CHAT_URL: ${GAME_MAIL_CHAT_URL:-}
      GAME_CHAT_SESSION_URL: ${GAME_CHAT_SESSION_URL:-}
      CHAT_SIGNING_SECRET: ${CHAT_SIGNING_SECRET:-}
      GAME_RESOURCES: /resources
      GAME_MAP_SIZE: 1200
      DEPENDENCY_TIMEOUT_MS: 5000
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./data/reference/server/runtime/base/resource
        target: /resources
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:18090/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opencok-api

    restart: unless-stopped
    profiles: [all, dev]
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks: [opencok-internal-network]
    mem_limit: 256m
    cpus: "0.50"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/opencok_global
      GLOBAL_DATABASE_NAME: opencok_global
      KINGDOM_ID: 1
      API_SERVERS_FILE: ""
      API_CHAT_URL: ${API_CHAT_URL:-}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_REDIS_URL: redis://redis:6379/0
      API_GAME_HOST: 192.168.1.104
      API_GAME_PORT: 9933
      API_DEPENDENCY_TIMEOUT_MS: 3000
    volumes:
      - type: bind
        source: ./apps/api/resources/servers.json
        target: /etc/opencok/servers.json
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  gateway:
    image: traefik:v3.7.15
    container_name: opencok-gateway

    restart: unless-stopped
    profiles: [all, dev]
    command: [--configFile=/etc/traefik/traefik.yml]
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    networks: [opencok-internal-network, opencok-external-network]
    mem_limit: 256m
    cpus: "0.50"
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - 80:80
      - 9933:9933
    volumes:
      - type: bind
        source: ./infra/gateway/traefik.yml
        target: /etc/traefik/traefik.yml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/gateway/dynamic.yml
        target: /etc/traefik/dynamic.yml
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: [CMD, traefik, healthcheck, --configFile=/etc/traefik/traefik.yml]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
