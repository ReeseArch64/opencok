name: opencok

networks:
  opencok-internal-network:
    name: opencok-internal-network
    internal: true
    driver: bridge

  opencok-external-network:
    internal: false
    name: opencok-external-network
    driver: bridge

volumes:
  postgres-data: ~
  pgadmin-data: ~
  pgadmin-servers: ~
  redis-data: ~
  mongodb-data: ~
  zookeeper-data: ~
  zookeeper-datalog: ~
  zookeeper-logs: ~
  minio-data: ~
  redisinsight-data: ~
  portainer-data: ~
  maple-data: ~

services:
  maple:
    image: opencok-maple:v0.3.0-csp1
    build:
      context: ./infra/observability/maple
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [all, dev, prod, observability]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      MAPLE_LOCAL_ACCESS_TOKEN: ${MAPLE_LOCAL_ACCESS_TOKEN}
      MAPLE_TELEMETRY: "off"
      MAPLE_NO_UPDATE_CHECK: 1
    ports:
      - 4318:4318
    volumes:
      - maple-data:/data
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  portainer:
    image: portainer/portainer-ce:lts
    command: [--http-enabled]
    container_name: opencok-portainer
    profiles: [all, devops]
    networks: [opencok-external-network]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    ports:
      - 9443:9000

  postgres:
    image: postgres:17.11-bookworm
    container_name: opencok-postgres
    restart: unless-stopped
    profiles: [all, dev, devops, database]
    networks: [opencok-internal-network]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-setup:
    build:
      context: .
      dockerfile: infra/compose/postgres.Dockerfile
    container_name: opencok-postgres-setup
    restart: no
    profiles: [all, dev, devops, database]
    networks: [opencok-internal-network]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-servers:/configuration

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: opencok-pgadmin
    restart: unless-stopped
    profiles: [all, devops, database]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opencok.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_SERVER_JSON_FILE: /configuration/servers.json
    ports:
      - 5050:8080
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - pgadmin-servers:/configuration:ro

  redis:
    image: redis:6.2.24-bookworm
    container_name: opencok-redis
    restart: unless-stopped
    profiles: [all, dev, devops, redis]
    networks: [opencok-internal-network]
    volumes:
      - redis-data:/data
    command:
      [
        redis-server,
        --bind,
        0.0.0.0,
        --tcp-keepalive,
        "60",
        --dir,
        /data,
        --save,
        "900",
        "1",
        --save,
        "300",
        "10",
        --save,
        "60",
        "10000",
        --appendonly,
        "yes",
        --appendfsync,
        everysec,
        --maxmemory,
        384mb,
        --maxmemory-policy,
        noeviction,
        --slowlog-log-slower-than,
        "-1",
      ]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  redisinsight:
    image: redis/redisinsight:latest
    container_name: opencok-redisinsight
    restart: no
    profiles: [all, devops, redis]
    depends_on:
      redis:
        condition: service_healthy
    networks: [opencok-internal-network, opencok-external-network]
    volumes:
      - redisinsight-data:/data
    ports:
      - 5540:5540

  zookeeper:
    image: zookeeper:3.4.14
    container_name: opencok-zookeeper
    restart: unless-stopped
    profiles: [all, dev, prod]
    networks: [opencok-internal-network]
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
      - zookeeper-logs:/logs
    environment:
      ZOO_INIT_LIMIT: 10
      ZOO_SYNC_LIMIT: 5
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
      ZOO_CFG_EXTRA: 4lw.commands.whitelist=ruok,srvr
    healthcheck:
      test: [CMD-SHELL, "printf srvr | nc -w 2 127.0.0.1 2181 | grep -q 'Mode: standalone'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  minio:
    image: ghcr.io/coollabsio/minio
    container_name: opencok-minio
    restart: unless-stopped
    profiles: [all, dev]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: opencok
      MINIO_ROOT_PASSWORD: opencok-secret
      MINIO_BROWSER_REDIRECT_URL: http://192.168.1.104:9001
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    networks: [opencok-internal-network, opencok-external-network]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mc alias set health http://127.0.0.1:9000 opencok opencok-secret >/dev/null 2>&1 && mc ready health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  minio-setup:
    image: ghcr.io/coollabsio/minio
    container_name: opencok-minio-setup
    restart: no
    profiles: [all, dev]
    entrypoint:
      - sh
      - -ec
      - |
        set -u
        mc alias set local http://minio:9000 opencok opencok-secret >/dev/null
        mc mb --ignore-existing local/opencok-cdn >/dev/null
        mc mb --ignore-existing local/opencok-uploads >/dev/null
        mc anonymous set none local/opencok-uploads >/dev/null
        cat > /tmp/cdn-public-read.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::opencok-cdn/cok.eleximg.com/*","arn:aws:s3:::opencok-cdn/asset.cok.chat/*"]}]}
        JSON
        mc anonymous set-json /tmp/cdn-public-read.json local/opencok-cdn >/dev/null
        mc mirror --overwrite --quiet /source/cok.eleximg.com/ local/opencok-cdn/cok.eleximg.com/ >/dev/null
        mc mirror --overwrite --quiet /source/asset.cok.chat/ local/opencok-cdn/asset.cok.chat/ >/dev/null
        printf '%s\n' 'CDN host trees synchronized; uploads and source archives are not public'
    volumes:
      - ./data/cdn/data:/source:ro
    networks: [opencok-internal-network]
    depends_on:
      minio:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: opencok-server
    restart: unless-stopped
    profiles: [all, dev, prod]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      NODE_ENV: ${NODE_ENV}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://maple:4318
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      DATABASE_URL: ${DATABASE_URL}
      KINGDOM_ID: 1
      KINGDOM_DATABASE_NAME: opencok_kingdom_1
      GLOBAL_DATABASE_NAME: opencok_global
      API_URL: http://api:8080
      REDIS_URL: ${REDIS_URL}
      GAME_ZOOKEEPER: zookeeper:2181
      GAME_SECRET: ${GAME_SECRET}
      CHAT_URL: ${CHAT_URL}
      CHAT_SECRET: ${CHAT_SECRET}
    depends_on:
      zookeeper:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:18090/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opencok-api
    restart: unless-stopped
    profiles: [all, dev, prod]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      NODE_ENV: ${NODE_ENV}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://maple:4318
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      DATABASE_URL: ${DATABASE_URL}
      GLOBAL_DATABASE_NAME: opencok_global
      KINGDOM_ID: 1
      CHAT_URL: ${CHAT_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      REDIS_URL: ${REDIS_URL}
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST}
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  mongodb:
    image: mongo:8.0.34
    restart: unless-stopped
    profiles: [all, dev, database]
    networks: [opencok-internal-network]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    profiles: [all, dev, database]
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      ME_CONFIG_MONGODB_URL: ${MONGO_URI:?Set MONGO_URI for Mongo Express}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "false"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 8081:8081

  chat:
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    container_name: opencok-chat
    restart: unless-stopped
    profiles: [all, dev, prod]
    init: true
    stop_grace_period: 30s
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://maple:4318
      MAPLE_LOCAL_INGEST_KEY: ${MAPLE_LOCAL_INGEST_KEY}
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      GLOBAL_DATABASE_NAME: opencok_global
      CHAT_KINGDOM_DATABASES: 1:opencok_kingdom_1,2:opencok_kingdom_2
      MONGO_URI: ${MONGO_URI}
      CHAT_SECRET: ${CHAT_SECRET}
    ports:
      - 8083:8083
    healthcheck:
      test:
        [
          CMD,
          bun,
          --no-env-file,
          -e,
          "fetch('http://127.0.0.1:8083/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  gateway:
    image: traefik:v3.7.15
    container_name: opencok-gateway
    restart: unless-stopped
    profiles: [all, dev, prod]
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedheaders.insecure=false
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.game.address=:9933
      - --entrypoints.health.address=:8082
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --ping.entrypoint=health
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=WARN
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.OriginStatus=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.queryparameters.defaultmode=drop
      - --experimental.otlplogs=true
      - --accesslog.otlp.servicename=gateway
      - --accesslog.otlp.http.endpoint=http://maple:4318/v1/logs
      - --accesslog.otlp.http.headers.Authorization=Bearer ${MAPLE_LOCAL_INGEST_KEY}
      - --metrics.otlp.servicename=gateway
      - --metrics.otlp.pushinterval=1s
      - --metrics.otlp.addrouterslabels=true
      - --metrics.otlp.http.endpoint=http://maple:4318/v1/metrics
      - --metrics.otlp.http.headers.Authorization=Bearer ${MAPLE_LOCAL_INGEST_KEY}
    networks: [opencok-internal-network, opencok-external-network]
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=opencok,deployment.environment.name=${NODE_ENV:-development}
      CDN_URL: ${CDN_URL}
    depends_on:
      api:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - 80:80
      - 9933:9933
    volumes:
      - ./infra/gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test:
        [CMD, traefik, healthcheck, --ping.entrypoint=health, --entrypoints.health.address=:8082]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
