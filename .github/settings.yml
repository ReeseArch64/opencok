  - name: investigation
    color: "#D4C5F9"
    description: Diagnosis of private server behavior and client compatibility issues.

  - name: needs triage
    color: "#FBCA04"
    description: Issues awaiting initial assessment and classification.

  - name: needs reproduction
    color: "#FBCA04"
