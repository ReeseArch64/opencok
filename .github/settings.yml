  - name: dependencies
    color: "#0366D6"
    description: Updates to project dependencies and third-party libraries.

  - name: refactoring
    color: "#A2EEEF"
    description: Code restructuring without changing existing behavior.

  - name: testing
    color: "#1D76DB"
    description: Changes to automated tests, fixtures, and test coverage.

  - name: ci/cd
    color: "#D93F0B"
    description: Changes to build, continuous integration, and deployment workflows.

  - name: maintenance
    color: "#FEF2C0"
    description: Routine upkeep, cleanup, and repository housekeeping.

  - name: regression
    color: "#B60205"
    description: Previously working functionality that is now broken.

  - name: compatibility
    color: "#5319E7"
    description: Compatibility across client versions, platforms, and environments.

  - name: database
    color: "#006B75"
    description: Changes to database schemas, queries, migrations, and seed data.

  - name: server
    color: "#0052CC"
    description: Changes to game servers and backend services.

  - name: client
    color: "#C5DEF5"
    description: Changes to game clients and client-side integrations.

  - name: networking
    color: "#006B75"
