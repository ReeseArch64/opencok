name: Chat and API media

on:
  push:
    branches: [main]
    paths:
      [
        "apps/chat/**",
        "apps/api/**",
        "packages/**",
        "package.json",
        "bun.lock",
        ".github/workflows/chat-files-tests.yml",
      ]

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/chat check-types
      - run: bun run --cwd apps/chat test
      - run: bun run --cwd apps/chat test:integration
      - run: bun run test:packages

  api-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/api check-types
      - run: bun run --cwd apps/api test
      - run: bun run --cwd apps/api test:media
      - run: bun run --cwd packages/core test
