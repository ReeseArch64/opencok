name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            app
            ci
            docs
            config
            infra
            deps
            release
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Examples:
              feat(api): add session refresh endpoint
              fix(app): correct redirect after login
              docs(docs): update API documentation
