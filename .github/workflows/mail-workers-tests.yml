name: PostgreSQL mail workers

on:
  push:
    branches: [main]
    paths:
      - "apps/workers/**"
      - "apps/server/src/composition/mail-integration.ts"
      - "apps/chat/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mail-workers-tests.yml"

permissions:
  contents: read

concurrency:
  group: mail-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/workers check-types
      - run: bun run --cwd apps/workers test
      - run: bun run --cwd apps/workers test:integration
      - run: bun run --cwd apps/workers build
