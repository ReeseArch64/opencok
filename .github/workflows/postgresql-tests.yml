name: PostgreSQL database

on:
  push:
    branches: [main]
    paths:
      - "packages/drizzle/**"
      - "packages/env/**"
      - ".env.example"
      - "bunfig.toml"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/postgresql-tests.yml"

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/env check-types
      - run: bun run --cwd packages/env test
      - run: bun run --cwd packages/drizzle check-types
      - run: DATABASE_ROLE=global bun run --cwd packages/drizzle db:check
      - run: DATABASE_ROLE=kingdom bun run --cwd packages/drizzle db:check
      - run: bun run --cwd packages/drizzle test:unit
      - run: bun run --cwd packages/drizzle test:snapshots
      - run: docker pull postgres:17.11-bookworm
      - run: bun run --cwd packages/drizzle test:e2e
