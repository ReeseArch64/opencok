name: PostgreSQL compatibility

on:
  pull_request:
    paths:
      - "packages/drizzle/**"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/postgresql-tests.yml"
  push:
    branches: [develop]
    paths:
      - "packages/drizzle/**"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/postgresql-tests.yml"

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/drizzle check-types
      - run: bun run --cwd packages/drizzle pg:check
      - run: bun run --cwd packages/drizzle test:pg:unit
      - run: bun run --cwd packages/drizzle test:pg:snapshots
      - run: docker pull mariadb:10.4.33
      - run: docker pull postgres:17.11-bookworm
      - run: bun run --cwd packages/drizzle test:pg:e2e
