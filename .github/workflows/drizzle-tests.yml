name: Drizzle tables

on:
  pull_request:
    paths:
      - "packages/drizzle/**"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/drizzle-tests.yml"
  push:
    branches: [develop]
    paths:
      - "packages/drizzle/**"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/drizzle-tests.yml"

permissions:
  contents: read

jobs:
  tables:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/drizzle check-types
      - run: bun run --cwd packages/drizzle test
      - run: docker pull mariadb:10.4.33
      - run: bun run --cwd packages/drizzle test:e2e
