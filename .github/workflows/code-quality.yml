name: Code quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:packages
      - run: bun --no-env-file install --cwd .github/formatting-pilot --frozen-lockfile --ignore-scripts
      - run: bun --no-env-file run .github/formatting-pilot/verify.ts
