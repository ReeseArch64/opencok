name: Commitlint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate commit messages
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup

      - name: Validate new commits
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${BASE_SHA:-}" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            bunx --no-install commitlint --from="$BASE_SHA" --to=HEAD --verbose
          else
            bunx --no-install commitlint --last --verbose
          fi
