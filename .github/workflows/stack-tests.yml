name: Local TypeScript stack

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/server/**"
      - "packages/**"
      - "infra/**"
      - "tests/stack/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/stack-tests.yml"

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/api check-types
      - run: bun run --cwd packages/env check-types
      - run: bunx --no-install tsc --noEmit -p tests/stack/tsconfig.json
      - run: bun run --cwd apps/api test
      - run: bun run --cwd packages/env test
      - run: bun run test:stack
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stack-diagnostics
          path: |
            /tmp/opencok-stack-*/compose-failure.log
            /tmp/opencok-stack-*/service-failure.log
          if-no-files-found: ignore
          retention-days: 3
