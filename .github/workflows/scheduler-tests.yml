name: PostgreSQL activity scheduler

on:
  push:
    branches: [main]
    paths:
      - "apps/scheduler/**"
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/scheduler-tests.yml"

permissions:
  contents: read

concurrency:
  group: activity-scheduler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/scheduler check-types
      - run: bun run --cwd apps/scheduler test
      - run: bun run --cwd apps/scheduler test:integration
      - run: bun run --cwd apps/scheduler build
