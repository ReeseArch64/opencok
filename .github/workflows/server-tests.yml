name: PostgreSQL realm server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".env.example"
      - ".github/workflows/server-tests.yml"

permissions:
  contents: read

concurrency:
  group: realm-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/server check-types
      - run: bun run --cwd packages/connection check-types
      - run: bun run --cwd packages/core check-types
      - run: bun run --cwd packages/core test
      - run: bun run --cwd packages/env test
      - run: bun run --cwd apps/server test
      - run: bun run --cwd apps/server test:mutations
      - run: bun run --cwd apps/server test:timed-mutations
      - run: bun run --cwd apps/server test:player-progression-mutations
      - run: bun run --cwd apps/server test:integration
