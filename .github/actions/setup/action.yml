name: Setup
description: Install Node 22, Bun, restore install cache, and install dependencies (frozen lockfile, no postinstall scripts).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Restore Bun install cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
