name: "Technical clarification task"
description: "Track a concrete technical question that requires repository investigation."
title: "[Question] "
labels:
  - "question"
  - "investigation"
  - "needs triage"
assignees:
  - "ReeseArch64"
body:
  - type: input
    id: prior-discussion
    attributes:
      label: "Prior discussion"
      description: "Before opening this issue, start a discussion or participate in an existing one about this topic. Link the discussion or your relevant comment."
      placeholder: "https://github.com/ReeseArch64/opencok/discussions/123"
    validations:
      required: true
  - type: checkboxes
    id: discussion-participation
    attributes:
      label: "Discussion participation"
      options:
        - label: "I opened or participated in the linked discussion before creating this issue and summarized its outcome below."
          required: true
  - type: textarea
    id: discussion-outcome
    attributes:
      label: "Discussion outcome"
      description: "Summarize the findings and explain why a concrete issue is now needed."
    validations:
      required: true
  -
    type: "markdown"
    attributes:
      value: "Use one issue per reproducible problem or scoped task. Search existing issues first. Do not publish credentials, player data, private Elex code, or client binaries. Report security vulnerabilities privately through the repository's Security tab."
  -
    type: "markdown"
    attributes:
      value: "For general help, gameplay questions, or early ideas, use [Discussions](https://github.com/ReeseArch64/opencok/discussions). Use this form for a scoped investigation with a verifiable answer."
  -
    type: "dropdown"
    id: "client-track"
    attributes:
      label: "Client compatibility track"
      description: "Select the client used for this scenario. A listed track is not a guarantee of support."
      options:
        - "v5.36.0"
        - "v6.12.20"
        - "v9.27.0"
        - "v12.06.0"
        - "Other / unknown"
        - "Not applicable"
    validations:
      required: true
  -
    type: "textarea"
    id: "question"
    attributes:
      label: "Technical question and impact"
      description: "State one answerable question about game behavior, a protocol, configuration, or kingdom operation. Explain which implementation or operator decision depends on the answer."
    validations:
      required: true
  -
    type: "textarea"
    id: "context"
    attributes:
      label: "Context and work already done"
      description: "Include server commit, relevant game flow, reproduction steps, guides consulted, and observations. Reference the required prior discussion and its findings."
    validations:
      required: true
  -
    type: "textarea"
    id: "completion"
    attributes:
      label: "Completion criteria"
      description: "State the experiment, evidence, or documentation that would resolve this question and who the result is useful to."
    validations:
      required: true
