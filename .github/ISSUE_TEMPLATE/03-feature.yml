name: "Feature request"
description: "Define a scoped improvement to gameplay or kingdom operation."
title: "[Enhancement] "
labels:
  - "enhancement"
  - "needs triage"
assignees:
  - "ReeseArch64"
body:
  - type: input
    id: prior-discussion
    attributes:
      label: "Prior discussion"
      description: "Before opening this issue, start a discussion or participate in an existing one about this topic. Link the discussion or your relevant comment."
      placeholder: "https://github.com/ReeseArch64/opencok/discussions/123"
    validations:
      required: true
  - type: checkboxes
    id: discussion-participation
    attributes:
      label: "Discussion participation"
      options:
        - label: "I opened or participated in the linked discussion before creating this issue and summarized its outcome below."
          required: true
  - type: textarea
    id: discussion-outcome
    attributes:
      label: "Discussion outcome"
      description: "Summarize the findings and explain why a concrete issue is now needed."
    validations:
      required: true
  -
    type: "markdown"
    attributes:
      value: "Use one issue per reproducible problem or scoped task. Search existing issues first. Do not publish credentials, player data, private Elex code, or client binaries. Report security vulnerabilities privately through the repository's Security tab."
  -
    type: "dropdown"
    id: "client-track"
    attributes:
      label: "Client compatibility track"
      description: "Select the client used for this scenario. A listed track is not a guarantee of support."
      options:
        - "v5.36.0"
        - "v6.12.20"
        - "v9.27.0"
        - "v12.06.0"
        - "Other / unknown"
        - "Not applicable"
    validations:
      required: true
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "Player or operator need"
      description: "Describe the game flow or operational problem and who benefits. Reference the required prior discussion and its findings."
    validations:
      required: true
  -
    type: "textarea"
    id: "proposal"
    attributes:
      label: "Proposed behavior and alternatives"
      description: "Describe the proposed game rules or operator workflow. For gameplay changes, include costs, rewards, timers, limits, and interactions with existing systems; distinguish compatibility restoration from custom rules."
    validations:
      required: true
  -
    type: "textarea"
    id: "impact"
    attributes:
      label: "Compatibility and saved-state impact"
      description: "Identify affected clients, server components, configuration, and existing player progression. Explain whether this should be opt-in per kingdom."
    validations:
      required: true
  -
    type: "textarea"
    id: "acceptance"
    attributes:
      label: "Acceptance criteria"
      description: "List observable outcomes and example scenarios that demonstrate completion, including relevant failure cases. Keep this issue small enough for focused stacked PRs."
    validations:
      required: true
