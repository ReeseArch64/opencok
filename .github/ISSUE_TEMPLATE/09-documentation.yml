name: "Documentation"
description: "Improve game setup, client preparation, or operator guides."
title: "[Documentation] "
labels:
  - "documentation"
  - "needs triage"
assignees:
  - "ReeseArch64"
body:
  - type: input
    id: prior-discussion
    attributes:
      label: "Prior discussion"
      description: "Before opening this issue, start a discussion or participate in an existing one about this topic. Link the discussion or your relevant comment."
      placeholder: "https://github.com/ReeseArch64/opencok/discussions/123"
    validations:
      required: true
  - type: checkboxes
    id: discussion-participation
    attributes:
      label: "Discussion participation"
      options:
        - label: "I opened or participated in the linked discussion before creating this issue and summarized its outcome below."
          required: true
  - type: textarea
    id: discussion-outcome
    attributes:
      label: "Discussion outcome"
      description: "Summarize the findings and explain why a concrete issue is now needed."
    validations:
      required: true
  - type: "markdown"
    attributes:
      value: "Use one issue per reproducible problem or scoped task. Search existing issues first. Do not publish credentials, player data, private Elex code, or client binaries. Report security vulnerabilities privately through the repository's Security tab."
  - type: "textarea"
    id: "location"
    attributes:
      label: "Guide, file, or missing topic"
      description: "Link the affected repository document, Wiki page, or guide section and identify the intended reader: player, operator, or contributor."
    validations:
      required: true
  - type: "textarea"
    id: "context"
    attributes:
      label: "Version and environment"
      description: "State applicable client tracks, platform, server commit, and deployment mode, or Not applicable."
    validations:
      required: true
  - type: "textarea"
    id: "change"
    attributes:
      label: "Gap and proposed correction"
      description: "Describe the incorrect or missing step and its effect on installation, patches, configuration, gameplay, backups, or troubleshooting. Include the exact failing step where relevant."
    validations:
      required: true
  - type: "textarea"
    id: "validation"
    attributes:
      label: "Documentation acceptance criteria"
      description: "Describe how another reader can follow and verify the revised instructions. Identify commands or outcomes that still need validation."
    validations:
      required: true
