name: "Client and server compatibility"
description: "Report protocol, resource, or behavior mismatches for a client build."
title: "[Compatibility] "
labels:
  - "compatibility"
  - "client"
  - "server"
  - "networking"
  - "needs triage"
assignees:
  - "ReeseArch64"
body:
  -
    type: "markdown"
    attributes:
      value: "Use one issue per reproducible problem or scoped task. Search existing issues first. Do not publish credentials, player data, private Elex code, or client binaries. Report security vulnerabilities privately through the repository's Security tab."
  -
    type: "dropdown"
    id: "client-track"
    attributes:
      label: "Client compatibility track"
      description: "Select the client used for this scenario. A listed track is not a guarantee of support."
      options:
        - "v5.36.0"
        - "v6.12.20"
        - "v9.27.0"
        - "v12.06.0"
        - "Other / unknown"
        - "Not applicable"
    validations:
      required: true
  -
    type: "textarea"
    id: "environment"
    attributes:
      label: "Client, server, and environment"
      description: "Include the exact client build, Android/iOS version and device or emulator, applied patch numbers, server branch and commit, and local or remote deployment. Use Not applicable for unrelated components."
    validations:
      required: true
  -
    type: "textarea"
    id: "matrix"
    attributes:
      label: "Working and failing combinations"
      description: "List client build + patch numbers + server commit for each tested combination, including the observed result. State explicitly which combinations are untested."
    validations:
      required: true
  -
    type: "textarea"
    id: "reproduction"
    attributes:
      label: "Connection or game flow"
      description: "Describe discovery, authentication, loading, or the affected gameplay action with exact reproduction steps and initial player state."
    validations:
      required: true
  -
    type: "textarea"
    id: "contract"
    attributes:
      label: "Expected and observed compatibility"
      description: "Identify missing resources, commands, fields, error codes, or fallback behavior. Explain the basis for the expected behavior; share only authorized, sanitized protocol excerpts."
    validations:
      required: true
  -
    type: "textarea"
    id: "acceptance"
    attributes:
      label: "Compatibility acceptance criteria"
      description: "Describe the affected flow that must work and which other client tracks should be checked for regressions."
    validations:
      required: true
  -
    type: "textarea"
    id: "evidence"
    attributes:
      label: "Evidence"
      description: "Attach sanitized logs, timestamps with timezone, screenshots, or a short recording. Use synthetic player data; omit account identifiers, tokens, keys, private code, and client binaries."
