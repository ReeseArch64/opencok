name: "Game server investigation"
description: "Investigate unexplained gameplay, protocol, or dependency behavior."
title: "[Investigation] "
labels:
  - "investigation"
  - "server"
  - "needs triage"
assignees:
  - "ReeseArch64"
body:
  -
    type: "markdown"
    attributes:
      value: "Use one issue per reproducible problem or scoped task. Search existing issues first. Do not publish credentials, player data, private Elex code, or client binaries. Report security vulnerabilities privately through the repository's Security tab."
  -
    type: "dropdown"
    id: "client-track"
    attributes:
      label: "Client compatibility track"
      description: "Select the client used for this scenario. A listed track is not a guarantee of support."
      options:
        - "v5.36.0"
        - "v6.12.20"
        - "v9.27.0"
        - "v12.06.0"
        - "Other / unknown"
        - "Not applicable"
    validations:
      required: true
  -
    type: "textarea"
    id: "environment"
    attributes:
      label: "Client, server, and environment"
      description: "Include the exact client build, Android/iOS version and device or emulator, applied patch numbers, server branch and commit, and local or remote deployment. Use Not applicable for unrelated components."
    validations:
      required: true
  -
    type: "textarea"
    id: "question"
    attributes:
      label: "Investigation objective"
      description: "State the specific unknown and its player/operator impact: missing handler, blocked event, queue stall, incorrect defaults, or external service dependency."
    validations:
      required: true
  -
    type: "textarea"
    id: "observations"
    attributes:
      label: "Observed facts and hypotheses"
      description: "Separate reproducible observations from hypotheses. Correlate game actions with sanitized request identifiers, timestamps, logs, configuration, and persisted state."
    validations:
      required: true
  -
    type: "textarea"
    id: "method"
    attributes:
      label: "Controlled experiments"
      description: "Describe tools, inputs, comparison setups, and how to reproduce or falsify each hypothesis without changing original extracted clients or keys."
    validations:
      required: true
  -
    type: "textarea"
    id: "outcome"
    attributes:
      label: "Completion criteria"
      description: "Define the evidence or documented conclusion needed to close the investigation and any follow-up implementation issues."
    validations:
      required: true
  -
    type: "textarea"
    id: "evidence"
    attributes:
      label: "Evidence"
      description: "Attach sanitized logs, timestamps with timezone, screenshots, or a short recording. Use synthetic player data; omit account identifiers, tokens, keys, private code, and client binaries."
