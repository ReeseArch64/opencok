name: "Performance investigation"
description: "Investigate slow gameplay, queue stalls, or high resource usage."
title: "[Performance] "
labels:
  - "performance"
  - "needs triage"
body:
  - type: input
    id: prior-discussion
    attributes:
      label: "Prior discussion"
      description: "Before opening this issue, start a discussion or participate in an existing one about this topic. Link the discussion or your relevant comment."
      placeholder: "https://github.com/ReeseArch64/opencok/discussions/123"
    validations:
      required: true
  - type: checkboxes
    id: discussion-participation
    attributes:
      label: "Discussion participation"
      options:
        - label: "I opened or participated in the linked discussion before creating this issue and summarized its outcome below."
          required: true
  - type: textarea
    id: discussion-outcome
    attributes:
      label: "Discussion outcome"
      description: "Summarize the findings and explain why a concrete issue is now needed."
    validations:
      required: true
  -
    type: "markdown"
    attributes:
      value: "Use one issue per reproducible problem or scoped task. Search existing issues first. Do not publish credentials, player data, private Elex code, or client binaries. Report security vulnerabilities privately through the repository's Security tab."
  -
    type: "dropdown"
    id: "client-track"
    attributes:
      label: "Client compatibility track"
      description: "Select the client used for this scenario. A listed track is not a guarantee of support."
      options:
        - "v5.36.0"
        - "v6.12.20"
        - "v9.27.0"
        - "v12.06.0"
        - "Other / unknown"
        - "Not applicable"
    validations:
      required: true
  -
    type: "textarea"
    id: "environment"
    attributes:
      label: "Client, server, and environment"
      description: "Include the exact client build, Android/iOS version and device or emulator, applied patch numbers, server branch and commit, and local or remote deployment. Use Not applicable for unrelated components."
    validations:
      required: true
  -
    type: "textarea"
    id: "workload"
    attributes:
      label: "Workload and host capacity"
      description: "Include CPU/RAM, service limits, database/cache versions, concurrent test players, kingdom size, request rate, and data volume where known."
    validations:
      required: true
  -
    type: "textarea"
    id: "reproduction"
    attributes:
      label: "Slow game flow and reproduction"
      description: "Identify login, map loading, marches, battles, queues, chat, or another operation. Include initial state, duration, frequency, and warm/cold cache conditions."
    validations:
      required: true
  -
    type: "textarea"
    id: "measurements"
    attributes:
      label: "Measured behavior and target"
      description: "Provide before/after or baseline measurements with units and sample count: latency, queue wait, frame rate, CPU, memory, or database timings. Distinguish client rendering delays from server response time."
    validations:
      required: true
  -
    type: "textarea"
    id: "method"
    attributes:
      label: "Measurement method"
      description: "Include repeatable commands, profiling steps, and controlled variables. Describe player impact and optional external dependencies involved."
    validations:
      required: true
  -
    type: "textarea"
    id: "evidence"
    attributes:
      label: "Evidence"
      description: "Attach sanitized logs, timestamps with timezone, screenshots, or a short recording. Use synthetic player data; omit account identifiers, tokens, keys, private code, and client binaries."
